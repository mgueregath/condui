name: CI

# Lightweight build check on every push/PR to main, separate from the
# release pipeline (.github/workflows/release.yml, tag-triggered only).
# Catches build breaks before they surface at tag time.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"
  WAILS3_VERSION: "v3.0.0-alpha.98-tui"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-24.04
            name: Linux
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      # Public OSS build: never fetches the private navoro submodule
      # (ssh-gui/backend/dbexplorer). See README's Database Explorer /
      # `dbmanager` build tag notes and .gitmodules `update = none`.
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ssh-gui/frontend/package-lock.json

      - name: Install system build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config gcc libc6-dev \
            libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      - name: Build
        working-directory: ssh-gui
        run: wails3 task build
